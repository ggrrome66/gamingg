[package]
name = "vx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The game binary: wires the world, mesher, renderer and window together."

[[bin]]
name = "gamingg"
path = "src/main.rs"

# The gold panel is the repository's first feature gate. Default-on so every
# dev build and test run carries it; the shipped Deck build compiles it out
# with `--no-default-features`, which is the only way to genuinely remove the
# source rather than trusting dead-code elimination.
[features]
default = ["gold"]
gold = []

[dependencies]
vx-core.workspace = true
vx-world.workspace = true
vx-mesh.workspace = true
vx-render.workspace = true
vx-agent.workspace = true
vx-platform.workspace = true
glam.workspace = true
rayon.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
rodio.workspace = true
