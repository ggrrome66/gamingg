[workspace]
resolver = "2"
members = [
    "crates/vx-core",
    "crates/vx-world",
    "crates/vx-mesh",
    "crates/vx-render",
    "crates/vx-platform",
    "crates/vx-save",
    "crates/vx-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vx-core = { path = "crates/vx-core" }
vx-world = { path = "crates/vx-world" }
vx-mesh = { path = "crates/vx-mesh" }
vx-render = { path = "crates/vx-render" }
vx-platform = { path = "crates/vx-platform" }
vx-save = { path = "crates/vx-save" }

glam = "0.33"
rayon = "1.12"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"
winit = "0.30"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Chunk meshing and worldgen are unusably slow in an unoptimised debug build.
# Optimise dependencies and our own hot crates even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.vx-world]
opt-level = 2

[profile.dev.package.vx-mesh]
opt-level = 2
