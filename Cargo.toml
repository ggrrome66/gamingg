[workspace]
resolver = "2"
members = [
    "crates/vx-core",
    "crates/vx-world",
    "crates/vx-mesh",
    "crates/vx-render",
    "crates/vx-agent",
    "crates/vx-platform",
    "crates/vx-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vx-core = { path = "crates/vx-core" }
vx-world = { path = "crates/vx-world" }
vx-mesh = { path = "crates/vx-mesh" }
vx-render = { path = "crates/vx-render" }
vx-agent = { path = "crates/vx-agent" }
vx-platform = { path = "crates/vx-platform" }

glam = "0.33"
rayon = "1.12"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"
winit = "0.30"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
# Playback only: every sound the game makes is synthesized, so the decoder
# features (flac/mp3/vorbis/...) stay off.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# Gamepads. The Linux backend enumerates pads over libudev and reads them
# off evdev, which is exactly what a Steam Deck presents.
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Chunk meshing and worldgen are unusably slow in an unoptimised debug build.
# Optimise dependencies and our own hot crates even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.vx-world]
opt-level = 2

[profile.dev.package.vx-mesh]
opt-level = 2

# Swarm tests run whole excavations block by block; unoptimised they take
# minutes rather than seconds.
[profile.dev.package.vx-agent]
opt-level = 2
